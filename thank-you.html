<!doctype html>
<html lang="en">
<head>

<title>Thank You — Gaegane Group</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
body{

  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}

.card{

  text-align:center;

.logo{

  margin:0 auto 28px;
  display:block;
}

h1{
  font-size:clamp(2rem,5vw,3.6rem);

  margin-bottom:18px;
}

p{
  color:#5f5a54;
  line-height:1.7;
  margin-bottom:32px;

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:52px;
  padding:0 24px;
  border-radius:999px;
  background:#731012;
  color:#fff;
  text-decoration:none;

}

</head>

<body>

<div class="card">
